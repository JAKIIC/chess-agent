[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-learning-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "windows-capture==2.0.1",
  "opencv-python>=4.10,<5",
  "numpy>=2,<3",
  "onnxruntime>=1.20,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-qt>=4,<5",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "PyInstaller>=6,<7",
]
training = ["torch>=2.5,<3", "torchvision>=0.20,<1"]

[project.scripts]
xiangqi-agent = "xiangqi_agent.__main__:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "windows: requires a real Windows desktop session",
  "assets: requires downloaded model or engine assets",
  "acceptance: requires manual real-application verification",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["xiangqi_agent"]
